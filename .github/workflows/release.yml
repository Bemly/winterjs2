# 10-target release 矩阵（`scripts/matrix.sh` 的上线版：matrix 只产 check 中间件，
# 这里产可发布的二进制 + GitHub Release）。
#
# 触发：tag `v*.*.*` 推送（发版）/ `workflow_dispatch`（空跑：只编不发，产物留 artifacts）。
# 资产命名对齐 `-u` 自升级期望：`winterjs2-<ver>-<target>.tar.gz`（win 为 `.zip`）。
# runner 依据（`actions/runner-images` 公仓免费表 + çeyrekfinans 公告）：
#   macos-latest / ubuntu-latest / windows-latest 系 + `-arm`/`-intel` 全是公仓免费 standard，
#   其中 macOS Intel（macos-26-intel）是最后一个 Intel 镜像，android/ohos 无 runner 只能交叉。
# 首跑八轮（2026-10-23）踩出的三处链接/安装阻塞已按 pitfalls 4.335 修：win openssl 改 vcpkg、
# android API 26（libaaudio）+ 静态 libc++、ohos 换 mozjs 同源 clang 19 + SDK 6.0.0.1。
# 进度与验收见 docs/plan3.md §0.4 CI1。
name: Release 10-target binaries

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  OPENSSL_VERSION: "4.0.3"
  OPENSSL_SHA256: "325b5c806167c13b40b1ffeadfe0248197c00eccc4cf123ec1e28d2d2fd216d9"
  OPENSSL_URL: "https://github.com/openssl/openssl/releases/download/openssl-4.0.3/openssl-4.0.3.tar.gz"
  NDK_VERSION: "r30"
  NDK_URL: "https://dl.google.com/android/repository/android-ndk-r30-linux.zip"
  # 26 起才有 libaaudio（cpal→ndk 的 AAudio 后端硬链 -laaudio；24 链接即 unable to find，pitfalls 4.335）。
  ANDROID_API: "26"
  # 与 servo/mozjs 预构建同源：SDK 6.0.0.1（sysroot）+ openharmony-rs clang 19（编/链）。
  OHOS_SDK_VERSION: "6.0.0.1"
  OHOS_LLVM_PREBUILT: "19"
  CARGO_OHOS_VERSION: "0.3.0"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            kind: native
            archive: targz
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-26-intel
            kind: native
            archive: targz
            smoke: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            kind: native
            archive: targz
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04-arm
            kind: native
            archive: targz
            smoke: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            kind: native
            archive: zip
            smoke: true
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            kind: native
            archive: zip
            smoke: true
          - target: aarch64-linux-android
            os: ubuntu-latest
            kind: ndk
            archive: targz
            smoke: false
          - target: x86_64-linux-android
            os: ubuntu-latest
            kind: ndk
            archive: targz
            smoke: false
          - target: aarch64-unknown-linux-ohos
            os: ubuntu-latest
            kind: ohos
            archive: targz
            smoke: false
          - target: x86_64-unknown-linux-ohos
            os: ubuntu-latest
            kind: ohos
            archive: targz
            smoke: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          # 取 Cargo.toml 首个顶格 version（[^"]* 遇首个引号即停，注释再长也进不来）。
          cargo_ver() { sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1; }
          if [[ "$TAG" == v* ]]; then
            VERSION="${TAG#v}"
            CARGO_VER="$(cargo_ver)"
            [ "$CARGO_VER" = "$VERSION" ] || { echo "tag $TAG != Cargo.toml $CARGO_VER"; exit 1; }
          else
            VERSION="$(cargo_ver)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION"

      - name: Rust toolchain + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Deps (ubuntu)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang libssl-dev perl make pkg-config unzip xz-utils libasound2-dev
          # libasound2-dev：linux 全列编 rodio/cpal（ALSA 后端）必需，runner 镜像不自带（首跑实锤）。

      - name: Deps (macos)
        if: startsWith(matrix.os, 'macos-')
        run: |
          brew install llvm openssl@3
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Deps (windows)
        if: startsWith(matrix.os, 'windows-')
        run: |
          # llvm 只给 bindgen 用；镜像多已自带（choco 已装即 warning 非零），放行，下面按 libclang.dll 兜底。
          [ -f "/c/Program Files/LLVM/bin/libclang.dll" ] || choco install llvm -y || true
          [ -f "/c/Program Files/LLVM/bin/libclang.dll" ] || { echo "libclang.dll missing"; exit 1; }
          # git-bash 自带 MSYS link.exe 会盖住 MSVC link.exe（rustc 按 PATH 取到它即终链失败）：删之。
          rm -f "/c/Program Files/Git/usr/bin/link.exe"
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      # openssl 改走 vcpkg 静态（static-md：静态库 + 动态 CRT，与 rustc msvc 缺省一致）：
      # choco 的 Shining Light 安装器在 runner 上静默装空（无注册表键、OPENSSL_CONF=\bin\…），
      # 两轮反查都找不到 libcrypto.lib（pitfalls 4.335）。vcpkg 源码编，产物按 triplet 缓存。
      - name: Cache vcpkg openssl (windows)
        if: startsWith(matrix.os, 'windows-')
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-installed
          key: vcpkg-openssl-${{ matrix.target }}-v1

      - name: OpenSSL via vcpkg (windows)
        if: startsWith(matrix.os, 'windows-')
        run: |
          case "${{ matrix.target }}" in
            aarch64-*) TRIPLET=arm64-windows-static-md ;;
            *) TRIPLET=x64-windows-static-md ;;
          esac
          ROOT="$RUNNER_TEMP/vcpkg-installed"
          OUT="$ROOT/$TRIPLET"
          if [ ! -f "$OUT/lib/libcrypto.lib" ]; then
            VCPKG="${VCPKG_INSTALLATION_ROOT:-}"
            # windows-11-arm 镜像不保证预装 vcpkg：缺则现拉现 bootstrap。
            if [ -z "$VCPKG" ] || [ ! -f "$VCPKG/vcpkg.exe" ]; then
              VCPKG="$RUNNER_TEMP/vcpkg"
              git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG"
              cmd //c "$(cygpath -w "$VCPKG/bootstrap-vcpkg.bat")" -disableMetrics
            fi
            "$VCPKG/vcpkg.exe" install "openssl:$TRIPLET" --x-install-root="$(cygpath -w "$ROOT")" --disable-metrics
          fi
          [ -f "$OUT/lib/libcrypto.lib" ] || { echo "vcpkg openssl missing:"; ls -R "$OUT" 2>/dev/null | head -n 40 || true; exit 1; }
          W="$(cygpath -w "$OUT")"
          {
            echo "OPENSSL_DIR=$W"
            echo "OPENSSL_LIB_DIR=$W\\lib"
            echo "OPENSSL_INCLUDE_DIR=$W\\include"
            echo "OPENSSL_STATIC=1"
          } >> "$GITHUB_ENV"

      - name: MSVC env (windows)
        if: startsWith(matrix.os, 'windows-')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cargo cache (per target)
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Cache NDK + openssl sysroots
        if: matrix.kind == 'ndk'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deps-ndk
          key: ndk-${{ env.NDK_VERSION }}-api${{ env.ANDROID_API }}-ossl-${{ env.OPENSSL_VERSION }}

      - name: Setup Android NDK + openssl sysroot
        if: matrix.kind == 'ndk'
        run: |
          # 本地 check-android.sh + build-openssl-android.sh 的 CI 版（linux prebuilt）。
          D="$RUNNER_TEMP/deps-ndk"
          mkdir -p "$D"
          if [ ! -d "$D/ndk/android-ndk-$NDK_VERSION" ]; then
            curl -fsSL -o "$D/ndk.zip" "$NDK_URL"
            mkdir -p "$D/ndk" && unzip -q "$D/ndk.zip" -d "$D/ndk"
          fi
          TC="$D/ndk/android-ndk-$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          case "${{ matrix.target }}" in
            aarch64-linux-android) TRIPLE=aarch64-linux-android; ENVN=aarch64_linux_android; CLANG=aarch64-linux-android${ANDROID_API}-clang; SYSR=sysroot-android-arm64; CFG=android-arm64 ;;
            *) TRIPLE=x86_64-linux-android; ENVN=x86_64_linux_android; CLANG=x86_64-linux-android${ANDROID_API}-clang; SYSR=sysroot-android-x86_64; CFG=android-x86_64 ;;
          esac
          {
            echo "CC_$ENVN=$TC/$CLANG"
            echo "CXX_$ENVN=$TC/${CLANG}++"
            echo "AR_$ENVN=$TC/llvm-ar"
            # CC_* 只管 cc crate；rustc 终链认 CARGO_TARGET_*_LINKER（本地只 check 从没链过，首跑实锤）。
          LINKER_ENV="CARGO_TARGET_$(echo "$TRIPLE" | tr 'a-z-' 'A-Z_')_LINKER"
          echo "$LINKER_ENV=$TC/$CLANG"
          # bindgen 取 cargo TARGET 当 clang --target，host 头文件在交叉列上必炸：
          # 官方口子 BINDGEN_EXTRA_CLANG_ARGS_<target> 指到 NDK 统一 sysroot；
          # 自带 --target= 即视为显式（bindgen 不再注入无版本号的，NDK cdefs.h 拒收无版本号）。
          BINDGEN_ENV="BINDGEN_EXTRA_CLANG_ARGS_$(echo "$TRIPLE" | tr '-' '_')"
          echo "$BINDGEN_ENV=--sysroot=$D/ndk/android-ndk-$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=${CLANG%-clang}"
          # mozjs_sys 非 apple/ohos 缺省链 stdc++（NDK 只有空壳），预构建引擎是 libc++（__ndk1）编的：
          # 经它认的 CXXSTDLIB 改链静态 libc++（NDK libc++.a 是 INPUT(-lc++_static -lc++abi) 脚本，
          # -bundle 防 rustc 把脚本当归档塞进 rlib）。单二进制分发，不带 libc++_shared.so。
          echo "CXXSTDLIB=static:-bundle=c++"
          } >> "$GITHUB_ENV"
          if [ ! -f "$D/$SYSR/usr/lib/libcrypto.a" ]; then
            [ -f "$D/openssl.tar.gz" ] || curl -fsSL -o "$D/openssl.tar.gz" "$OPENSSL_URL"
            echo "$OPENSSL_SHA256  $D/openssl.tar.gz" | sha256sum -c -
            export ANDROID_NDK_ROOT="$D/ndk/android-ndk-$NDK_VERSION" ANDROID_API
            BRIDGE="$D/android-clang-bin" && mkdir -p "$BRIDGE"
            ln -sf "$TC/llvm-ar" "$BRIDGE/${CLANG%-*}-ar" 2>/dev/null || true
            ln -sf "$TC/llvm-ranlib" "$BRIDGE/${CLANG%-*}-ranlib" 2>/dev/null || true
            export PATH="$BRIDGE:$TC:$PATH"
            W="$D/work-$SYSR" && rm -rf "$W" && mkdir -p "$W"
            tar -xzf "$D/openssl.tar.gz" -C "$W" --strip-components=1
            # openssl 的 android Configure 缺省取 NDK 最高 API（首跑实锤 android37-clang）：
            # 必须显式钉 __ANDROID_API__，否则可能引用低版本 libc 没有的符号。
            ( cd "$W" && ./Configure "$CFG" -D__ANDROID_API__="$ANDROID_API" --prefix="$D/$SYSR/usr" no-shared no-tests no-docs \
              && make build_libs -j"$(nproc)" && make install_dev )
          fi
          {
            echo "OPENSSL_DIR=$D/$SYSR/usr"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
          } >> "$GITHUB_ENV"

      # OHOS 列与 servo/mozjs 发版同构（其 build.yml ohos job）：SDK 6.0.0.1 只取 sysroot，
      # 编译/链接用 openharmony-rs 预构建 clang 19——mozjs 的 libjs_static.a 就是它编的，
      # libc++ 内联命名空间是 std::__h；SDK 5.0.3 自带 clang 15 的 libc++ 是 std::__n1，
      # 链接即整片 undefined std::__h::*（pitfalls 4.335）。env 由 cargo-ohos 推导（不进 Cargo 依赖）。
      - name: Setup OHOS SDK
        if: matrix.kind == 'ohos'
        id: ohos_sdk
        uses: openharmony-rs/setup-ohos-sdk@v1.0
        with:
          version: ${{ env.OHOS_SDK_VERSION }}
          components: native

      - name: Cache OHOS openssl sysroot
        if: matrix.kind == 'ohos'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deps-ohos
          key: ohos-${{ env.OHOS_SDK_VERSION }}-llvm${{ env.OHOS_LLVM_PREBUILT }}-ossl-${{ env.OPENSSL_VERSION }}-${{ matrix.target }}

      - name: OHOS toolchain env + openssl sysroot
        if: matrix.kind == 'ohos'
        run: |
          cargo install "cargo-ohos@$CARGO_OHOS_VERSION" --locked
          NATIVE="${{ steps.ohos_sdk.outputs.ohos_sdk_native }}"
          [ -d "$NATIVE/sysroot" ] || { echo "OHOS native sysroot missing under $NATIVE"; ls "$NATIVE" || true; exit 1; }
          # sh 格式逐行 `export K='V'` → GITHUB_ENV（V 内含空格无妨；带连字符的键 sh 格式本就不吐）。
          cargo ohos env --target "${{ matrix.target }}" --sdk "$NATIVE" \
            --download-prebuilt "$OHOS_LLVM_PREBUILT" --format sh > "$RUNNER_TEMP/ohos-env.sh"
          sed -n "s/^export \([A-Za-z0-9_]*\)='\(.*\)'\$/\1=\2/p" "$RUNNER_TEMP/ohos-env.sh" >> "$GITHUB_ENV"
          # mozjs_sys 对 ohos 缺省 -lc++ 走 libc++.so（运行期要 libc++_shared.so 随包）：
          # 经它认的 CXXSTDLIB 改静态（-bundle 防 rustc 塞进 rlib）。本地实链验证：NEEDED 只剩
          # libc/libz/hilog/time_service，无 __h 未决、无 libc++ 运行期依赖。
          echo "CXXSTDLIB=static:-bundle=c++" >> "$GITHUB_ENV"
          . "$RUNNER_TEMP/ohos-env.sh"
          ENVN="$(echo "${{ matrix.target }}" | tr '-' '_')"
          CC_V="$(eval echo "\$CC_$ENVN")"
          case "${{ matrix.target }}" in
            aarch64-*) CFG=linux-aarch64 ;;
            *) CFG=linux-x86_64 ;;
          esac
          D="$RUNNER_TEMP/deps-ohos"
          SYSR="$D/sysroot-${{ matrix.target }}"
          mkdir -p "$D"
          if [ ! -f "$SYSR/usr/lib/libcrypto.a" ] && [ ! -f "$SYSR/usr/lib64/libcrypto.a" ]; then
            curl -fsSL -o "$D/openssl.tar.gz" "$OPENSSL_URL"
            echo "$OPENSSL_SHA256  $D/openssl.tar.gz" | sha256sum -c -
            W="$D/work" && rm -rf "$W" && mkdir -p "$W"
            tar -xzf "$D/openssl.tar.gz" -C "$W" --strip-components=1
            ( cd "$W" && CC="$CC_V" AR="$TARGET_AR" RANLIB="$TARGET_RANLIB" \
                ./Configure "$CFG" --prefix="$SYSR/usr" no-shared no-tests no-docs \
              && make build_libs -j"$(nproc)" && make install_dev )
          fi
          {
            echo "OPENSSL_DIR=$SYSR/usr"
            echo "OPENSSL_STATIC=1"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
          } >> "$GITHUB_ENV"

      - name: Tree audit (banned backends)
        run: |
          # matrix.sh §2 门控的 CI 版：aws-lc / native-tls 禁入；openssl 仅 winterjs2 直引（DH 用）。
          for pkg in aws-lc-rs aws-lc-sys native-tls; do
            if cargo tree --target "${{ matrix.target }}" -i "$pkg" >/dev/null 2>&1; then
              echo "banned $pkg in tree"; exit 1;
            fi
          done
          rev="$(cargo tree --target "${{ matrix.target }}" -i openssl 2>/dev/null || true)"
          echo "$rev" | grep -q winterjs2 || { echo "openssl missing"; exit 1; }
          echo "$rev" | grep -Eq 'reqwest|rustls|hyper|tokio-rustls|native-tls' && { echo "openssl in TLS chain"; exit 1; } || true

      - name: Build release
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Smoke (AGENTS §3)
        if: matrix.smoke
        run: |
          EXE=""; [ "${{ matrix.archive }}" = "zip" ] && EXE=".exe"
          BIN="target/${{ matrix.target }}/release/winterjs2$EXE"
          "$BIN" --eval '40 + 2'
          "$BIN" --eval 'await new Promise(r=>setTimeout(()=>r(1),10))'
          "$BIN" --eval 'new URL("https://ex.com/?a=1").search'
          "$BIN" --eval 'new TextEncoder().encode("hi").length'
          "$BIN" --eval 'await (await fetch("data:text/plain,x")).text()'

      # win 冒烟崩溃取证：exit 139 无一行输出，按 cdb 抓首个异常栈（msvc 恒出 pdb，公共符号可解）。
      - name: Crash stack (windows, smoke failed)
        if: failure() && matrix.smoke && startsWith(matrix.os, 'windows-')
        run: |
          BIN="target/${{ matrix.target }}/release/winterjs2.exe"
          ARCHDIR=x64; [[ "${{ matrix.target }}" == aarch64-* ]] && ARCHDIR=arm64
          CDB="/c/Program Files (x86)/Windows Kits/10/Debuggers/$ARCHDIR/cdb.exe"
          [ -f "$CDB" ] || CDB="$(find '/c/Program Files (x86)/Windows Kits' -path "*$ARCHDIR*" -name cdb.exe -print -quit 2>/dev/null)"
          [ -n "$CDB" ] && [ -f "$CDB" ] || { echo "cdb not found"; exit 1; }
          export _NT_SYMBOL_PATH="$(cygpath -w "$PWD/target/${{ matrix.target }}/release");srv*https://msdl.microsoft.com/download/symbols"
          "$CDB" -g -G -lines -c ".lastevent; r; kn 40; q" "$(cygpath -w "$BIN")" --eval "40 + 2" || true

      - name: Package
        run: |
          EXE=""; PKG="tar.gz"; [ "${{ matrix.archive }}" = "zip" ] && { EXE=".exe"; PKG="zip"; }
          STAGE="winterjs2-$VERSION-${{ matrix.target }}"
          mkdir -p dist staging/"$STAGE"
          cp "target/${{ matrix.target }}/release/winterjs2$EXE" staging/"$STAGE"/
          ( cd staging && { [ "$PKG" = "zip" ] \
            && powershell -NoProfile -Command "Compress-Archive -Path '$STAGE' -DestinationPath '../dist/$STAGE.zip'" \
            || tar -czf "../dist/$STAGE.tar.gz" "$STAGE"; } )
          ( cd dist && sha256sum "$STAGE.$PKG" > "$STAGE.$PKG.sha256" )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all assets
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # 首版先 draft：人工核对 10 件资产无误后再点 Publish；跑顺后改成 draft: false。
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/**/*"
          draft: true
          generate_release_notes: true
